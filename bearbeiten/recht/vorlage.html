<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} — 925law</title>
<meta name="robots" content="noindex, follow">
<link rel="alternate" hreflang="de" href="{{url_de}}">
<link rel="alternate" hreflang="en" href="{{url_en}}">
<link rel="alternate" hreflang="x-default" href="{{url_de}}">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/legal.css">
{{analytics}}
</head>
<body>
<a class="skip" href="#inhalt">{{skip}}</a>
<header class="site-header">
  <div class="wrap head-row">
    <a class="brand" href="{{home}}" aria-label="{{brand_label}}">
      <svg aria-hidden="true" class="logo-mark" height="28" viewBox="0 0 120 120" width="28">
        <circle cx="60" cy="60" r="52"></circle>
        <circle cx="60" cy="60" opacity="0.5" r="42" stroke-width="1.4"></circle>
        <text font-size="26" text-anchor="middle" x="60" y="68">925</text>
      </svg>
      <span>925law</span>
    </a>
    <div class="lang-switch">{{lang_switch}}</div>
  </div>
</header>
<main class="wrap" id="inhalt">
  <a href="{{home}}" class="back">← {{back}}</a>
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap footer-bottom">
    <span class="footer-brand">
      <svg aria-hidden="true" height="18" viewBox="0 0 120 120" width="18">
        <circle cx="60" cy="60" fill="none" r="52" stroke="currentColor" stroke-width="4"></circle>
        <text fill="currentColor" font-family="'Archivo', sans-serif" font-size="34" font-weight="700" text-anchor="middle" x="60" y="72">925</text>
      </svg>
      <span>{{footer_brand}}</span>
    </span>
    <span>Berlin</span>
    <span class="footer-legal">{{footer_legal}}</span>
  </div>
</footer>
</body>
</html>
